<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="1000" fill="#ffffff"/>
  <!-- one rectangular room, 6.0 m x 4.5 m, drawn at 150 px per metre -->
  <rect x="150" y="170" width="900" height="675" fill="#f7f7f7" stroke="#202020" stroke-width="14"/>
  <text x="600" y="520" font-size="34" text-anchor="middle" fill="#404040">Living room</text>
  <!-- width dimension -->
  <line x1="150" y1="110" x2="1050" y2="110" stroke="#202020" stroke-width="3"/>
  <line x1="150" y1="90" x2="150" y2="130" stroke="#202020" stroke-width="3"/>
  <line x1="1050" y1="90" x2="1050" y2="130" stroke="#202020" stroke-width="3"/>
  <text x="600" y="92" font-size="40" text-anchor="middle" fill="#202020">6.0 m</text>
  <!-- depth dimension -->
  <line x1="1110" y1="170" x2="1110" y2="845" stroke="#202020" stroke-width="3"/>
  <line x1="1090" y1="170" x2="1130" y2="170" stroke="#202020" stroke-width="3"/>
  <line x1="1090" y1="845" x2="1130" y2="845" stroke="#202020" stroke-width="3"/>
  <text x="1150" y="507" font-size="40" text-anchor="middle" fill="#202020" transform="rotate(90 1150 507)">4.5 m</text>
  <text x="600" y="940" font-size="26" text-anchor="middle" fill="#606060">Floor plan · scale not stated · dimensions as marked</text>
</svg>
